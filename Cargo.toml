[workspace]
resolver = "2"
members = ["crates/core", "crates/cli", "crates/verifier", "crates/builder"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0"

[workspace.dependencies]
aes-gcm = "0.10"
ed25519-dalek = { version = "3.0.0", features = ["rand_core"] }
digest = "0.10"
getrandom = "0.3.0"
hex = "0.4"
md-5 = "0.10"
pbkdf2 = "0.12"
rayon = "1.10"
reed-solomon-erasure = "6.0.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
tempfile = "3.0"
tauri = "2.0"
tauri-build = "2.0"
tauri-plugin-dialog = "2.0"
tauri-plugin-opener = "2.0"
walkdir = "2.5"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
opt-level = "z"
